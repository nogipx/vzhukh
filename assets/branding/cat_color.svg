<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Master artwork: the "vzhukh" wizard cat, full colour, transparent
       background. Platform icons frame it via scripts/build_icons.sh. -->
  <defs>
    <filter id="sticker" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2.2" result="d"/>
      <feFlood flood-color="#fff"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="star" stroke-width=".18" stroke-linejoin="round"
          d="M0 -1 L.265 -.364 L.951 -.309 L.428 .139 L.588 .809 L0 .45 L-.588 .809 L-.428 .139 L-.951 -.309 L-.265 -.364 Z"/>
  </defs>

  <g transform="translate(-2 6) scale(.9)">
    <g filter="url(#sticker)">
      <!-- ears -->
      <path d="M18 58 L22 30 L40 44 Z" fill="#8C8378"/>
      <path d="M24 48 L25 37 L33 44 Z" fill="#E8B4AC"/>
      <path d="M58 42 L72 28 L76 56 Z" fill="#8C8378"/>
      <path d="M64 44 L71 35 L72 48 Z" fill="#E8B4AC"/>
      <!-- head -->
      <path d="M12 68 Q12 44 46 44 Q80 44 80 68 Q80 90 46 90 Q12 90 12 68 Z" fill="#9A9186"/>
      <ellipse cx="46" cy="78" rx="15" ry="9" fill="#F3EFE9"/>
      <g stroke="#4E463D" stroke-width="2.5" stroke-linecap="round" fill="none">
        <path d="M40 49 L41 55"/><path d="M46 48 L46 55"/><path d="M52 49 L51 55"/>
        <path d="M14 64 L22 66"/><path d="M14 71 L22 71"/><path d="M78 64 L70 66"/><path d="M78 71 L70 71"/>
      </g>
      <!-- unimpressed eyes -->
      <path d="M28 63 Q35 60 42 63 Q35 67.5 28 63 Z" fill="#E2DB6B"/>
      <path d="M50 63 Q57 60 64 63 Q57 67.5 50 63 Z" fill="#E2DB6B"/>
      <ellipse cx="36" cy="64" rx="1.6" ry="2.1" fill="#2A2620"/>
      <ellipse cx="57" cy="64" rx="1.6" ry="2.1" fill="#2A2620"/>
      <g stroke="#2A2620" stroke-width="2.4" stroke-linecap="round" fill="none">
        <path d="M27 62.5 Q35 60 43 62.5"/><path d="M49 62.5 Q57 60 65 62.5"/>
      </g>
      <path d="M43 70 L49 70 L46 73.5 Z" fill="#D88E86"/>
      <path d="M43 78 Q46 79.5 49 78" stroke="#4E463D" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <!-- party hat -->
      <path d="M28 47 Q47 39 66 42 L57 4 Z" fill="#2F6BFF"/>
      <circle cx="51" cy="20" r="1.6" fill="#fff"/><circle cx="45" cy="33" r="1.9" fill="#FFD84D"/>
      <circle cx="56" cy="28" r="1.5" fill="#fff"/><circle cx="53" cy="39" r="1.6" fill="#7FD3FF"/>
      <circle cx="61" cy="36" r="1.6" fill="#FFD84D"/>
      <!-- wand and paw -->
      <path d="M8 98 L72.9 70.7" stroke="#111" stroke-width="6.5"/>
      <path d="M72.9 70.7 L84 66" stroke="#fff" stroke-width="6.5"/>
      <ellipse cx="26" cy="90" rx="7.5" ry="6" fill="#F3EFE9"/>
    </g>
  </g>

  <!-- stars -->
  <use href="#star" transform="translate(80 50) scale(5.45)" fill="#FF3B3B" stroke="#FF3B3B"/>
  <use href="#star" transform="translate(90 40) scale(4.55)" fill="#2FE0FF" stroke="#2FE0FF"/>
  <use href="#star" transform="translate(88 62) scale(4.09)" fill="#39D353" stroke="#39D353"/>
  <use href="#star" transform="translate(82 76) scale(3.64)" fill="#FF3FB4" stroke="#FF3FB4"/>
</svg>
